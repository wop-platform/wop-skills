# Sourcery 规则保留清单（显式化"评论清零"的边界）。
# 2026-08-31 评审确认的保留项：
# - no-loop-in-tests / no-conditionals-in-tests：测试内循环/条件断言是惯用法
# 其余规则全开；新增触发点由 CI gate（sourcery-review-gate.yml）拦截。
version: '1'

ignore:
- .git
- env
- .env
- .tox
- node_modules
- vendor
- venv
- .venv
- dist
- coverage
- StrykerOutput

rule_settings:
  enable:
  - default
  disable:
  - no-loop-in-tests
  - no-conditionals-in-tests
  # 2026-09-03 追平上游裁决（awesome-rules .sourcery.yaml 2026-09-01）：
  # low-code-quality 是长 main 顺序流程的聚合标签——mutations/run.py 无可操作
  # 子建议，拆分收益边际。run.py 为上游 skip 面逐字节拷贝，不为过门偏离上游。
  - low-code-quality

  rule_types:
  - refactoring
  - suggestion
  - comment
